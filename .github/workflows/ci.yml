name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build & test
        shell: bash
        run: mvn -B verify

      - name: Verify fat JAR
        shell: bash
        run: |
          set -euo pipefail
          jar=$(ls target/burp-audit-ai-*.jar | grep -v '\.original$' | head -n1)
          test -f "$jar" || { echo "::error::fat JAR not found"; exit 1; }
          echo "Built: $jar ($(du -h "$jar" | cut -f1))"
          # Montoya API must stay excluded from the fat JAR.
          if unzip -l "$jar" | grep -q 'net/portswigger/burp/extensions/montoya'; then
            echo "::error::montoya-api leaked into fat JAR — shade excludes broken"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: burp-audit-ai-${{ matrix.os }}
          path: target/burp-audit-ai-*.jar
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build (skip tests — already covered by build job)
        shell: bash
        run: mvn -B -DskipTests package

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          jar=$(ls target/burp-audit-ai-*.jar | grep -v '\.original$' | head -n1)
          sha256sum "$jar" > "$jar.sha256"
          cat "$jar.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/burp-audit-ai-*.jar
            target/burp-audit-ai-*.jar.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true